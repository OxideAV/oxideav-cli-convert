[package]
name = "oxideav-cli-convert"
version = "0.0.9"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/OxideAV/oxideav-cli-convert"
authors = ["Mark Karpeles"]
description = "ImageMagick-style convert engine for the oxideav CLI — translates IM arg syntax into an oxideav-pipeline Job"

readme = "README.md"
homepage = "https://github.com/OxideAV/oxideav-cli-convert"
keywords = ["multimedia", "convert", "imagemagick", "cli", "pipeline"]
categories = ["multimedia", "command-line-utilities"]

[features]
default = ["generator", "mesh3d", "ico"]
# Hooks the oxideav-generator shorthand translator into the convert
# arg parser (`xc:`, `pattern:`, `gradient:`, `synth:`, `testsrc:`, …).
# Off → those shorthands fall through unchanged and the source registry
# rejects them as unknown URIs.
generator = ["dep:oxideav-generator"]
# Wires the 3D-asset side-channel: STL / OBJ / glTF / GLB / USDZ
# inputs decode into an `oxideav_mesh3d::Scene3D`, then encode through
# the matching encoder factory pulled out of the
# `Mesh3DRegistry` populated by `oxideav_meta::populate_mesh3d_registry`.
# `oxideav-stl` / `oxideav-obj` / `oxideav-gltf` are pulled directly so
# the per-format encoder-option flags (`-stl-format`, `-gltf-format`,
# …) can construct an encoder with options that the registry's
# parameter-less factory closures can't pass through.
# Off → 3D-format inputs fall through to the regular pipeline path,
# which doesn't know what to do with them and errors out cleanly.
# Slim builds (no 3D in the dep tree) compile fine without this.
mesh3d = [
    "dep:oxideav-mesh3d",
    "dep:oxideav-meta",
    "dep:oxideav-stl",
    "dep:oxideav-obj",
    "dep:oxideav-gltf",
    "dep:oxideav-fbx",
    "dep:oxideav-render",
]
# Wires `.ico` output: an ImageMagick-style multi-resolution Windows
# icon writer driven by `-define icon:auto-resize=W,W,…`. The input is
# any still-image format the caller's registry opens (through
# `oxideav-image`). Off → `.ico` falls through to the regular pipeline
# and errors out as an unknown sink extension.
ico = ["dep:oxideav-ico"]

[dependencies]
oxideav-core = "0.1.41"
oxideav-source = "0.1"
oxideav-pipeline = "0.1"
oxideav-image-filter = "0.1.3"
oxideav-generator = { version = "0.1", optional = true }
# Scene-aware inputs (PDF reader → Scene with pages) + per-page fan-out.
oxideav-pdf = "0.2"
oxideav-scene = "0.1"
oxideav-raster = "0.1"
oxideav-pixfmt = "0.1"
# Still-image read / write for the side-channels (PDF page renders,
# 3D renders, the icon writer's input): the Layer-2 image gateway.
# It resolves demuxer / decoder / encoder / muxer from the caller's
# `RuntimeContext`, so every image crate registered there (png, bmp,
# jpeg, webp, gif, tiff, qoi, heif, …) is readable and writable here
# without a per-format dependency. No format crate is pulled directly.
oxideav-image = "0.0.5"
# SVG writer for the per-page vector output path (PDF→SVG, no raster).
oxideav-svg = "0.1"
# 3D-asset side-channel — typed Scene3D model + the helper that fills
# a registry with every enabled 3D-format codec sibling
# (stl/obj/gltf/usdz). Both deps are optional + gated on the `mesh3d`
# feature so a slim build without 3D in the dep tree still compiles.
# `oxideav-meta`'s default features pull every codec/container/filter
# in the workspace; we explicitly opt down to just `3d` so we don't
# drag in audio/video/image siblings the convert verb already wires
# directly.
oxideav-mesh3d = { version = "0.0", optional = true }
oxideav-meta = { version = "0.0", optional = true, default-features = false, features = ["3d"] }
# Direct format-encoder deps so per-format option flags can construct
# encoders bypassing the registry (which only stores parameter-less
# factory closures). All three are pulled with their default `registry`
# feature off the table — we don't need their `register()` helpers
# inside cli-convert (oxideav-meta already does that wiring); we only
# want the typed encoder constructors.
oxideav-stl = { version = "0.0", optional = true }
oxideav-obj = { version = "0.0", optional = true }
oxideav-gltf = { version = "0.0", optional = true }
# FBX (Filmbox) binary decoder — read-only today (no encoder in the
# workspace yet). Wired directly because oxideav-meta 0.0.1's generated
# `populate_mesh3d_registry` predates the FBX publish; once a newer
# meta knows about FBX we can drop this direct dep and route through
# meta exclusively.
oxideav-fbx = { version = "0.0", optional = true }
# 3D rasteriser — Phase B sibling crate. Owns the scanline backend
# (Flat / Gouraud / Phong / Wireframe + NormalDebug / DepthDebug) we
# used to ship in-tree at `src/mesh3d_render.rs`. Convert routes
# `Mesh3DOptions` through the adapter that survives in
# `mesh3d_render::run`.
oxideav-render = { version = "0.0", optional = true }
# Pure-Rust ICO (Windows icon) writer. Optional + default-on; gated on
# the `ico` feature so slim builds drop it cleanly. Stays a direct
# dependency: an icon bundles sub-images of different sizes, which the
# gateway's one-geometry-per-sequence `encode_frames` cannot write.
oxideav-ico = { version = "0.0", optional = true }
indexmap = "2"
serde_json = "1"

[dev-dependencies]
# The integration tests build their own `RuntimeContext` and register
# the formats the gateway resolves at test time directly (each crate's
# `register(&mut ctx)`), the way the oxideav CLI's own context is
# built. `oxideav-meta::register_all` would be the one-liner, but the
# published aggregator registers nothing outside the umbrella (its
# build script reads the normalized manifest), so the tests name the
# crates they exercise. Dev-only: nothing here reaches a consumer.
oxideav-png = "0.1"
oxideav-bmp = "0.1"
oxideav-mjpeg = "0.1"
oxideav-webp = "0.3"
oxideav-gif = "0.0"
oxideav-tiff = "0.0"
oxideav-qoi = "0.1"
# HEIF-family targets (`.heic` HEVC stills, `.avif` through the `avif`
# encoder on the heif muxer, `.heics` sequences): the production path
# the gateway's codec pick, metadata carriage and quality ladder are
# proved on.
oxideav-heif = "0.0.13"
oxideav-avif = "0.0.16"
oxideav-h265 = "0.0"
