[package]
name = "oxideav-cli-convert"
version = "0.0.3"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/OxideAV/oxideav-cli-convert"
authors = ["Mark Karpeles"]
description = "ImageMagick-style convert engine for the oxideav CLI — translates IM arg syntax into an oxideav-pipeline Job"

readme = "README.md"
homepage = "https://github.com/OxideAV/oxideav-cli-convert"
keywords = ["multimedia", "convert", "imagemagick", "cli", "pipeline"]
categories = ["multimedia", "command-line-utilities"]

[features]
default = ["generator"]
# Hooks the oxideav-generator shorthand translator into the convert
# arg parser (`xc:`, `pattern:`, `gradient:`, `synth:`, `testsrc:`, …).
# Off → those shorthands fall through unchanged and the source registry
# rejects them as unknown URIs.
generator = ["dep:oxideav-generator"]

[dependencies]
oxideav-core = "0.1"
oxideav-source = "0.1"
oxideav-pipeline = "0.1"
oxideav-image-filter = "0.0.4"
oxideav-generator = { version = "0.1", optional = true }
indexmap = "2"
serde_json = "1"
